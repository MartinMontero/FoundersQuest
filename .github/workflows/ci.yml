name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit:
    name: build · parity · function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: end-to-end (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Publishes dist/ + functions/ to Cloudflare Pages on every green push to main.
  # Uses a least-privilege token (Cloudflare Pages: Edit) stored as a repo secret —
  # never in the repo. Skips cleanly until the secret is present, so it never blocks.
  deploy:
    name: deploy to Cloudflare Pages
    needs: [unit, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping deploy. Add the repo secrets (Settings → Secrets and variables → Actions) and re-run this job."
            exit 0
          fi
          # Create the Pages project on first run (idempotent); ignore "already exists".
          npx wrangler@4 pages project create foundersquest --production-branch=main 2>/dev/null || echo "project exists (ok)"
          npx wrangler@4 pages deploy dist --project-name=foundersquest --branch=main
